; The php-fpm pool for the `app` container, installed over /etc/php/8.4/fpm/pool.d/www.conf.
;
; It has to *replace* the shipped pool rather than sit next to it: two files in pool.d/ both
; declaring [www] is a duplicate pool definition, which php-fpm refuses to start with.
;
; https://www.php.net/manual/en/install.fpm.configuration.php

[www]

user = www-data
group = www-data

; A unix socket rather than 127.0.0.1:9000 — nginx shares this container, so nothing has to listen
; on a TCP port at all. Only nginx's user may connect.
listen = /run/php/php8.4-fpm.sock
listen.group = www-data
listen.owner = www-data
listen.mode = 0660

; Sized for a self-hosted instance.
; The ceiling that matters is max_children × memory_limit (512M in files/php.ini).
; Raise max_children only alongside the memory the host actually has.
pm = dynamic
pm.max_children = 10
pm.max_requests = 500
pm.max_spare_servers = 5
pm.min_spare_servers = 2
pm.start_servers = 3

; Required to forward environment variables to Laravel (APP_KEY, DB_HOST, etc.).
;
; The entrypoint runs `artisan optimize` under the CLI SAPI, where the environment is intact, so
; bootstrap/cache/config.php would usually paper over it. But a cleared or failed config cache
; does not fail loudly — it silently falls back to framework defaults (DB_HOST to 127.0.0.1, empty
; APP_KEY...). Thus, forwarding the environment variables is important.
clear_env = no

; Anything the workers write to stdout/stderr (PHP warnings, Laravel's "stderr" log channel) is
; relayed to the master, and the -O flag in run-web.sh puts the master's output in the container log.
; Undecorated, so the lines stay as PHP wrote them.
catch_workers_output = yes
decorate_workers_output = no

; FPM's own access log would duplicate nginx's, which is off by design here — cf. files/nginx.conf.
access.log = /dev/null
