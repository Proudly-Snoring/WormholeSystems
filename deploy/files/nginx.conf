# The web server inside the `app` container.
# Serve static files straight from /app/public, everything else handed to php-fpm over a unix socket.
# Plain HTTP on port 8080.
#
# This is the *whole* nginx configuration: it is installed as /etc/nginx/nginx.conf, replacing the
# one Debian ships. That file assumes a root user which this image does not have.
#
# https://nginx.org/en/docs/dirindex.html

# One worker per core, each pinned to its own, as Debian has it.
worker_processes auto;
worker_cpu_affinity auto;

pid /run/nginx/nginx.pid;
error_log /var/log/nginx/error.log;

include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;

	# No version number in the `Server` header or on error pages.
	server_tokens off;

	server {
		# IPv4 only, deliberately: nothing reaches this container over IPv6.
		# Docker's default bridge is v4, and the proxy connects by service name.
		# A `listen [::]:8080` would make nginx fail to start on a host booted with ipv6.disable=1.
		listen 8080 default_server;
		server_name _;

		root /app/public;
		index index.php;
		charset utf-8;

		# No access log: this server is an internal backend, and the proxy in front of it already logs every request once with the real client address.
		# Errors still go to the container log — silence there would hide real faults.
		access_log off;
		error_log /dev/stderr warn;

		# Must stay in sync with upload_max_filesize/post_max_size in files/php.ini.
		# Else nginx may reject uploads PHP would have accepted.
		client_max_body_size 64M;

		gzip on;
		gzip_vary on;
		gzip_proxied any;
		gzip_min_length 1024;
		gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

		# Vite writes hashed filenames under build/, and workbox ships its runtime as a hashed file at the root of public/.
		# A new build changes the name, so both can be cached indefinitely.
		# `add_header` alone rather than alongside `expires 1y`: the latter emits its own Cache-Control, and the response would carry the header twice.
		location /build/ {
			add_header Cache-Control "public, max-age=31536000, immutable";
			try_files $uri =404;
		}
		location ~ ^/workbox-[0-9a-f]+\.js$ {
			add_header Cache-Control "public, max-age=31536000, immutable";
			try_files $uri =404;
		}

		# The opposite case: a cached service worker pins itself and everything it caches, so these two have to be revalidated on every load.
		# They are how a stale client learns a new build exists.
		location ~ ^/(sw|sw-legacy-cleanup)\.js$ {
			add_header Cache-Control "no-cache";
			try_files $uri =404;
		}

		location = /favicon.ico {
			log_not_found off;
		}

		location = /robots.txt {
			log_not_found off;
		}

		location / {
			try_files $uri $uri/ /index.php?$query_string;
		}

		location = /index.php {
			include snippets/fastcgi-php.conf;
			fastcgi_pass unix:/run/php/php8.4-fpm.sock;
			# Matches max_execution_time in files/php.ini:
			# A shorter timeout here would turn a slow request into a 504 while PHP kept working on it.
			fastcgi_read_timeout 300s;

			# Bumping headers max. size to 32k as nginx defaults to a single 4k/8k buffer, which this application overruns:
			# AddLinkHeadersForPreloadedAssets plus Vite's aggressive prefetching emit a single `Link:`
			# header listing every preloaded asset, which alone is larger than the default buffer.
			fastcgi_buffer_size 32k;
			fastcgi_buffers 16 32k;
			fastcgi_busy_buffers_size 64k;
		}

		# Only the front controller is executable.
		# Anything else ending in .php is not (ex: a file that slipped into the storage symlink, a stray vendor script...).
		location ~ \.php$ {
			return 404;
		}

		# public/ ships a .htaccess for Apache users - nginx would otherwise serve it as plain text if not denied.
		location ~ /\. {
			deny all;
		}
	}
}
