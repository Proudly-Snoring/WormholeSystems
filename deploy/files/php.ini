[PHP]
; Conservative defaults for a self-hosted instance — raise if you hit limits
; (e.g. large killmail backfills), either by editing this file or mounting
; your own over /etc/php/8.4/fpm/conf.d/99-wormholesystems.ini (web requests)
; and /etc/php/8.4/cli/conf.d/99-wormholesystems.ini (queue, scheduler, reverb, artisan).
max_execution_time = 300
memory_limit = 512M
post_max_size = 64M
upload_max_filesize = 64M

[opcache]
; The application code is baked into the image and never changes while a container runs, and the
; entrypoint has already run `artisan optimize` by the time php-fpm starts. That lets opcache run
; in its cheapest mode: compile every file once, cache it, and never touch the filesystem again.
;
; opcache.enable=1 turns caching on for the FPM (web) SAPI.
;
; opcache.validate_timestamps=0 disables the per-request stat() call PHP would otherwise make to
; check whether each cached file changed on disk.
;
; opcache.memory_consumption=192 (MB) and opcache.max_accelerated_files=20000 size the cache to
; hold the entire application's compiled bytecode at once, so nothing gets evicted and recompiled
; mid-run.
;
; opcache.interned_strings_buffer=16 (MB) sizes the pool PHP uses to deduplicate identical strings
; (e.g. repeated class/property names) across all cached files.
;
; CLI is deliberately left alone (opcache.enable_cli defaults to 0) because those processes are either:
; sporadic artisan calls or long-running workers (queue, scheduler, reverb) that stay in memory.
; None of them gain real benefit from caching.
opcache.enable = 1
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 192
opcache.validate_timestamps = 0
