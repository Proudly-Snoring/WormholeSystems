# Local override to build the image from source instead of pulling it from GHCR.
# Start a local stack available only from localhost (plain HTTP, no ACME).
#
# Needs Compose v2.24 or newer, for the `!override` tag on `ports` below.
#
# Usage (from the repository root):
# - Run `deploy/generate-env.sh` and fill .env configuration like a production stack.
#   Make sure to enable all profiles: `COMPOSE_PROFILES=mariadb,proxy,redis`.
# - Start the stack with:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml up --build -d
# - The app is then available on http://localhost:8000.

x-local-image: &local-image
  image: wormholesystems:local
  environment: 
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: "http://localhost:8000"
    DISCORD_CALLBACK: "http://localhost:8000/discord/callback"
    EVE_CALLBACK: "http://localhost:8000/eve/callback"
    LOG_LEVEL: debug
    REVERB_APP_KEY: local # matches VITE_REVERB_APP_KEY in the build args below.
    SESSION_SECURE_COOKIE: "false"

services:
  app:
    <<: *local-image
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VITE_REVERB_APP_KEY: local
        VITE_REVERB_HOST: localhost
        VITE_REVERB_PORT: 8000
        VITE_REVERB_SCHEME: http

  discord: *local-image
  killmail-listener: *local-image
  queue: *local-image
  reverb: *local-image
  scheduler: *local-image

  proxy:
    environment:
      # A bare port instead of a hostname keeps Caddy on plain HTTP and skips ACME entirely.
      # Merged key by key with the base file's block, so CADDY_GLOBAL_OPTIONS survives.
      SERVER_NAME: ":80"
    ports: !override
      # Explicitly on the loopbackto avoid exposing the instance on the local network.
      - "127.0.0.1:8000:80"
