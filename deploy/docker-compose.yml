# Proudly Snoring's production stack for mapper.prsn.online, running the published image.
#
# Quick start (from the repository root):
# - Run `deploy/generate-env.sh`,
# - Fill in EVE_CLIENT_ID, EVE_CLIENT_SECRET and CONTACT_EMAIL in `deploy/.env`,
# - Boot the stack with `docker compose -f deploy/docker-compose.yml up -d`.
#
# The `app` service terminates TLS itself: FrankenPHP embeds Caddy, which gets a Let's Encrypt
# certificate for SERVER_NAME and proxies /app/* to Reverb over the internal network.
#
# To build the image from source instead of pulling it, layer `deploy/docker-compose.local.yml`
# on top — cf. its header comment.

x-app: &app
  image: ghcr.io/proudly-snoring/wormholesystems:latest
  depends_on:
    mariadb:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    # Built from CONTACT_EMAIL in deploy/.env, so that is the only address to fill in there.
    APP_USER_AGENT: "Proudly-Snoring/WormholeSystems | https://mapper.prsn.online | contact: ${CONTACT_EMAIL}"
    BROADCAST_CONNECTION: reverb
    CACHE_STORE: redis
    # Caddy's global options — the ACME account contact, so Let's Encrypt has somewhere to send
    # expiry warnings. Only the `app` service reads this; harmless as an unused var elsewhere.
    # `:+` so an unset CONTACT_EMAIL drops the whole directive.
    CADDY_GLOBAL_OPTIONS: "${CONTACT_EMAIL:+email ${CONTACT_EMAIL}}"
    DB_CONNECTION: mysql
    DB_HOST: mariadb
    DB_DATABASE: wormholesystems
    DB_USERNAME: wormholesystems
    LOG_STACK: daily
    QUEUE_CONNECTION: database
    REDIS_HOST: redis
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
  env_file:
    - .env
  # The FrankenPHP base image ships `HEALTHCHECK curl -f http://localhost:2019/metrics`, which only the `app` service can answer.
  # The others run an artisan command, not the web server, so they would sit permanently `unhealthy`.
  healthcheck:
    disable: true
  networks:
    - wormholesystems
  volumes:
    - laravel-storage:/app/storage

services:
  app:
    <<: *app
    ports:
      - "80:80" # needed by ACME (the challenge answers on 80).
      - "443:443" # HTTPS (HTTP/1 and HTTP/2)
      - "443:443/udp" # for HTTP/3.
    restart: unless-stopped
    volumes:
      # Caddy's certificate store. Without it every restart re-requests the certificate.
      - caddy-data:/data
      - laravel-storage:/app/storage
    healthcheck:
      # Not the public site: with SERVER_NAME set to a hostname, a request to :80 gets redirected to https://<hostname>/,
      # which the container cannot resolve. Caddy serves a loopback-only plain-HTTP copy on 8081 for exactly this.
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8081/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Generous, because nothing answers until entrypoint.sh is done: on a first boot that means
      # the whole migration set before the web server even starts. Going unhealthy there would
      # also strand every service that waits on `app: service_healthy`.
      start_period: 180s

  # Slash commands and personal Discord alerts.
  # Behind a profile because the Discord keys in deploy/.env are optional: started unconditionally, it
  # would crash-loop on any instance that left DISCORD_BOT_TOKEN empty.
  # Start it with `--profile discord`, and register the commands once beforehand — cf. the "Discord bot" section of deploy/readme.md.
  discord:
    <<: *app
    profiles: ["discord"]
    command: php artisan discord:listen
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  killmail-listener:
    <<: *app
    command: php artisan app:listen-for-killmails
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  queue:
    <<: *app
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  reverb:
    <<: *app
    # No published port: browsers reach the websocket through Caddy on the app's own origin (wss://<hostname>/app/<key>),
    # so Reverb only ever needs to be reachable from inside the compose network.
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["supercronic", "-overlapping", "/etc/supercronic/laravel"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  mariadb:
    image: mariadb:12.3
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      MARIADB_DATABASE: wormholesystems
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_USER: wormholesystems
    networks:
      - wormholesystems
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      # A plain `mariadb-admin ping -h localhost` answers over the unix socket while MariaDB is still running its init scripts, i.e. before MARIADB_DATABASE/MARIADB_USER exist.
      # Going over TCP with the application credentials proves the server, the user and the database are all ready.
      test: ["CMD", "mariadb", "-h", "127.0.0.1", "-u", "wormholesystems", "-p${DB_PASSWORD}", "-e", "SELECT 1", "wormholesystems"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    image: mariadb:12.3
    profiles: ["backup"]
    restart: "no"
    environment:
      MARIADB_HOST: mariadb
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - wormholesystems
    volumes:
      - ./backups:/backups
      - ./files/backup.sh:/backup.sh:ro
    entrypoint: ["bash", "/backup.sh"]

  redis:
    image: redis:7.2
    restart: unless-stopped
    networks:
      - wormholesystems
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  wormholesystems:

volumes:
  laravel-storage:
  mariadb-data:
  caddy-data:
